<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אנפי - סטטיסטיקות קטלוג</title>
    <link rel="icon" type="image/png" sizes="512x512" href="favicon.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2e5541;
            --accent: #c4d71f;
            --dark-bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(46, 85, 65, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .dashboard {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        header img {
            height: 60px;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            margin: 0;
        }

        .main-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .stat-card .value {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent);
            display: block;
            margin-bottom: 0.5rem;
        }

        .stat-card .label {
            font-size: 1.1rem;
            color: var(--text-dim);
            font-weight: 600;
        }

        .chart-section {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .chart-section h2 {
            margin-top: 0;
            margin-bottom: 2rem;
            font-size: 1.4rem;
            border-bottom: 2px solid var(--accent);
            display: inline-block;
            padding-bottom: 5px;
        }

        .chart-container {
            height: 400px;
            position: relative;
        }

        .conversion-info {
            text-align: center;
            margin-top: 2rem;
            font-size: 1.2rem;
            color: var(--text-dim);
        }

        .conversion-info span {
            color: var(--accent);
            font-weight: 700;
        }

        .leads-section {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            margin-top: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .leads-section h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.4rem;
            border-bottom: 2px solid var(--accent);
            display: inline-block;
            padding-bottom: 5px;
        }

        .leads-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        .leads-table th, .leads-table td {
            padding: 12px 14px;
            text-align: right;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .leads-table th {
            color: var(--accent);
            font-weight: 700;
        }

        .leads-table tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .leads-table a {
            color: #60a5fa;
            text-decoration: none;
        }

        .leads-table a:hover {
            text-decoration: underline;
        }

        #login-overlay {
            position: fixed;
            inset: 0;
            background: var(--dark-bg);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1.5rem;
        }

        input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 12px;
            color: white;
            font-size: 1.2rem;
            width: 280px;
            text-align: center;
        }

        button {
            background: var(--accent);
            color: var(--dark-bg);
            border: none;
            padding: 1rem 3rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .nav-catalog-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .nav-catalog-btn:hover {
            background: var(--accent);
            color: var(--dark-bg);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .dashboard { padding: 1rem; }
            .stat-card .value { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <img src="logo white.png" alt="Anfi">
    <h1>כניסה למערכת דוחות</h1>
    <input type="password" id="pass-input" placeholder="הכנס סיסמה">
    <button onclick="checkAccess()">כניסה</button>
    <a href="index.html" class="nav-catalog-btn" style="margin-top: 1rem;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        מעבר לקטלוג
    </a>
</div>

<div class="dashboard" id="main-dashboard" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <a href="index.html" class="nav-catalog-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            מעבר לקטלוג
        </a>
        <button onclick="fetchStats()" class="nav-catalog-btn" style="cursor: pointer;">
            רענן נתונים ↻
        </button>
    </div>

    <header>
        <img src="logo white.png" alt="Anfi">
        <h1>סיכום פעילות קטלוג</h1>
    </header>

    <div class="main-stats">
        <div class="stat-card">
            <span class="value" id="total-views">0</span>
            <span class="label">מבקרים באתר</span>
        </div>
        <div class="stat-card">
            <span class="value" id="total-downloads">0</span>
            <span class="label">הורדות קטלוג</span>
        </div>
        <div class="stat-card" style="border: 2px solid var(--accent);">
            <span class="value" id="total-leads">0</span>
            <span class="label">לידים ופניות</span>
        </div>
        <div class="stat-card">
            <span class="value" id="whatsapp-clicks">0</span>
            <span class="label">לחיצות וואטסאפ</span>
        </div>
    </div>

    <div class="chart-section">
        <h2>פעילות לפי ימים</h2>
        <div class="chart-container">
            <canvas id="mainChart"></canvas>
        </div>
        <div class="conversion-info">
            עד כה, סך הכל <span id="conv-rate">0%</span> מהמבקרים הורידו את הקטלוג.
        </div>
    </div>

    <div class="leads-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2 style="margin: 0;">פניות אחרונות מטופס יצירת קשר</h2>
            <button onclick="fetchStats()" class="refresh-btn" style="padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.9rem; cursor: pointer;">רענן נתונים ↻</button>
        </div>
        <div style="overflow-x: auto;">
            <p id="no-leads-msg" style="color: var(--text-dim); text-align: center; margin: 1rem 0;">טוען פניות...</p>
            <table id="leads-table" class="leads-table" style="display: none;">
                <thead>
                    <tr>
                        <th>תאריך</th>
                        <th>שם מלא</th>
                        <th>שם עסק</th>
                        <th>טלפון</th>
                        <th>אימייל</th>
                        <th>תחום עניין</th>
                        <th>הודעה</th>
                    </tr>
                </thead>
                <tbody id="leads-tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://abqracafkjerlcemqnva.supabase.co";
    const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFicXJhY2Fma2plcmxjZW1xbnZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3NDk1NTYsImV4cCI6MjA4MDMyNTU1Nn0.WejWdsYxqC7ESs3C8UkGhWUpnDJ7xD5j4-n9BKRE7rE";
    const supabaseClient =
        window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
    let chartInstance = null;

    // Auto login if already authenticated in this session
    if (sessionStorage.getItem('stats_authenticated') === 'true') {
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('main-dashboard').style.display = 'block';
        window.addEventListener('DOMContentLoaded', fetchStats);
    }

    async function checkAccess() {
        const passInput = document.getElementById('pass-input');
        const loginBtn = document.querySelector('#login-overlay button');
        const enteredPassword = passInput.value.trim();

        if (!enteredPassword) {
            alert('נא להזין סיסמה');
            return;
        }

        loginBtn.disabled = true;
        const originalText = loginBtn.innerText;
        loginBtn.innerText = 'מאמת...';

        try {
            const response = await fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: enteredPassword })
            });

            const result = await response.json();

            if (response.ok && result.success) {
                sessionStorage.setItem('stats_authenticated', 'true');
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-dashboard').style.display = 'block';
                fetchStats();
            } else {
                alert(result.message || 'סיסמה שגויה');
                passInput.value = '';
                passInput.focus();
            }
        } catch (err) {
            console.error('Auth error:', err);
            // Local development fallback
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:') {
                console.warn('שרת האימות המקומי לא רץ - מאפשר גישה מקומית לצורכי פיתוח בלבד');
                sessionStorage.setItem('stats_authenticated', 'true');
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-dashboard').style.display = 'block';
                fetchStats();
                return;
            }
            alert('שגיאה בתקשורת עם שרת האימות (/api/auth). ודא שהפרויקט רץ ב-Vercel.');
        } finally {
            loginBtn.disabled = false;
            loginBtn.innerText = originalText;
        }
    }

    document.getElementById('pass-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAccess(); });

    async function fetchStats() {
        try {
            if (!supabaseClient) {
                throw new Error("ספריית Supabase לא נטענה בדף");
            }

            // 1. Fetch events from catalog_events
            const { data: events, error: eventsErr } = await supabaseClient
                .from('catalog_events')
                .select('event_type, created_at')
                .order('created_at', { ascending: true });

            if (eventsErr) throw eventsErr;

            // 2. Fetch leads from catalog_leads
            const { data: leads, error: leadsErr } = await supabaseClient
                .from('catalog_leads')
                .select('*')
                .order('created_at', { ascending: false });

            if (leadsErr) console.warn("Leads fetch warning:", leadsErr);

            const summary = {
                page_view: 0,
                catalog_download: 0,
                whatsapp_click: 0,
                total_leads: (leads || []).length
            };

            const dailyMap = {};

            (events || []).forEach(evt => {
                const type = evt.event_type;
                if (type === 'page_view') summary.page_view++;
                else if (type === 'catalog_download') summary.catalog_download++;
                else if (type === 'whatsapp_click') summary.whatsapp_click++;

                if (evt.created_at) {
                    const dateStr = evt.created_at.substring(0, 10);
                    if (!dailyMap[dateStr]) {
                        dailyMap[dateStr] = { views: 0, downloads: 0 };
                    }
                    if (type === 'page_view') dailyMap[dateStr].views++;
                    if (type === 'catalog_download') dailyMap[dateStr].downloads++;
                }
            });

            const sortedDates = Object.keys(dailyMap).sort();
            const viewsList = sortedDates.map(d => dailyMap[d].views);
            const downloadsList = sortedDates.map(d => dailyMap[d].downloads);

            render({
                summary: summary,
                daily: {
                    labels: sortedDates,
                    views: viewsList,
                    downloads: downloadsList
                },
                leads: leads || []
            });

        } catch (err) {
            console.error("Dashboard Error:", err);
            alert("שגיאה בטעינת נתונים מ-Supabase (" + err.message + "). בצע רענון לדף.");
        }
    }

    function render(data) {
        const s = data.summary;
        
        document.getElementById('total-views').innerText = s.page_view || 0;
        document.getElementById('total-downloads').innerText = s.catalog_download || 0;
        document.getElementById('total-leads').innerText = s.total_leads || 0;
        document.getElementById('whatsapp-clicks').innerText = s.whatsapp_click || 0;
        
        const rate = s.page_view > 0 ? (((s.catalog_download || 0) / s.page_view) * 100).toFixed(1) : 0;
        document.getElementById('conv-rate').innerText = `${rate}%`;

        // Render chart
        const ctx = document.getElementById('mainChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();
        
        const formattedLabels = (data.daily.labels || []).map(label => {
            try {
                const date = new Date(label);
                return date.toLocaleDateString('he-IL', { day: '2-digit', month: '2-digit' });
            } catch (e) { return label; }
        });

        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: formattedLabels,
                datasets: [
                    {
                        label: 'מבקרים',
                        data: data.daily.views,
                        backgroundColor: 'rgba(255, 255, 255, 0.1)',
                        borderColor: '#94a3b8',
                        borderWidth: 1
                    },
                    {
                        label: 'הורדות',
                        data: data.daily.downloads,
                        backgroundColor: '#c4d71f',
                        borderRadius: 5
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#f8fafc', font: { family: 'Assistant', size: 14 } } } },
                scales: {
                    y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                }
            }
        });

        // Render leads table
        const leads = data.leads || [];
        const noLeadsMsg = document.getElementById('no-leads-msg');
        const leadsTable = document.getElementById('leads-table');
        const tbody = document.getElementById('leads-tbody');
        tbody.innerHTML = '';

        if (leads.length === 0) {
            noLeadsMsg.innerText = 'טרם התקבלו פניות חדשות בטופס.';
            noLeadsMsg.style.display = 'block';
            leadsTable.style.display = 'none';
        } else {
            noLeadsMsg.style.display = 'none';
            leadsTable.style.display = 'table';

            leads.forEach(lead => {
                const tr = document.createElement('tr');
                const dateStr = lead.created_at ? new Date(lead.created_at).toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' }) : '-';
                const phoneHtml = lead.phone ? `<a href="tel:${escapeHtml(lead.phone)}">${escapeHtml(lead.phone)}</a>` : '-';
                const emailHtml = lead.email ? `<a href="mailto:${escapeHtml(lead.email)}">${escapeHtml(lead.email)}</a>` : '-';

                tr.innerHTML = `
                    <td style="white-space: nowrap;">${dateStr}</td>
                    <td><strong>${escapeHtml(lead.full_name || '')}</strong></td>
                    <td>${escapeHtml(lead.business_name || '-')}</td>
                    <td dir="ltr" style="text-align: right;">${phoneHtml}</td>
                    <td>${emailHtml}</td>
                    <td>${escapeHtml(lead.category || '-')}</td>
                    <td style="max-width: 250px; word-break: break-word;">${escapeHtml(lead.message || '-')}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.innerText = str;
        return div.innerHTML;
    }
</script>
</body>
</html>
