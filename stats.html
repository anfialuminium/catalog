<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אנפי - סטטיסטיקות קטלוג</title>
    <link rel="icon" type="image/png" sizes="512x512" href="favicon.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2e5541;
            --accent: #c4d71f;
            --dark-bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(46, 85, 65, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .dashboard {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        header img {
            height: 60px;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            margin: 0;
        }

        .main-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .stat-card .value {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent);
            display: block;
            margin-bottom: 0.5rem;
        }

        .stat-card .label {
            font-size: 1.1rem;
            color: var(--text-dim);
            font-weight: 600;
        }

        .chart-section {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .chart-section h2 {
            margin-top: 0;
            margin-bottom: 2rem;
            font-size: 1.4rem;
            border-bottom: 2px solid var(--accent);
            display: inline-block;
            padding-bottom: 5px;
        }

        .chart-container {
            height: 400px;
            position: relative;
        }

        .conversion-info {
            text-align: center;
            margin-top: 2rem;
            font-size: 1.2rem;
            color: var(--text-dim);
        }

        .conversion-info span {
            color: var(--accent);
            font-weight: 700;
        }

        #login-overlay {
            position: fixed;
            inset: 0;
            background: var(--dark-bg);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1.5rem;
        }

        input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 12px;
            color: white;
            font-size: 1.2rem;
            width: 280px;
            text-align: center;
        }

        button {
            background: var(--accent);
            color: var(--dark-bg);
            border: none;
            padding: 1rem 3rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .dashboard { padding: 1rem; }
            .stat-card .value { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <img src="logo white.png" alt="Anfi">
    <h1>כניסה למערכת דוחות</h1>
    <input type="password" id="pass-input" placeholder="הכנס סיסמה">
    <button onclick="checkAccess()">כניסה</button>
</div>

<div class="dashboard" id="main-dashboard" style="display: none;">
    <header>
        <img src="logo white.png" alt="Anfi">
        <h1>סיכום פעילות קטלוג</h1>
    </header>

    <div class="main-stats">
        <div class="stat-card">
            <span class="value" id="total-views">0</span>
            <span class="label">מבקרים באתר</span>
        </div>
        <div class="stat-card">
            <span class="value" id="total-downloads">0</span>
            <span class="label">הורדות קטלוג</span>
        </div>
        <div class="stat-card" style="border: 2px solid var(--accent);">
            <span class="value" id="total-leads">0</span>
            <span class="label">לידים ופניות</span>
        </div>
        <div class="stat-card">
            <span class="value" id="whatsapp-clicks">0</span>
            <span class="label">לחיצות וואטסאפ</span>
        </div>
    </div>

    <div class="chart-section">
        <h2>פעילות לפי ימים</h2>
        <div class="chart-container">
            <canvas id="mainChart"></canvas>
        </div>
        <div class="conversion-info">
            עד כה, סך הכל <span id="conv-rate">0%</span> מהמבקרים הורידו את הקטלוג.
        </div>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxNOvhsOV9ziR-IsftBgu2tAXgHx1gj7jy00yfZSadz67hspkPPbMzjn7Q003UWQCSq/exec";
    let chartInstance = null;

    function checkAccess() {
        if (document.getElementById('pass-input').value === "3737") {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('main-dashboard').style.display = 'block';
            fetchStats();
        } else {
            alert('סיסמה שגויה');
        }
    }

    document.getElementById('pass-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAccess(); });

    async function fetchStats(retryCount = 0) {
        try {
            const url = `${GAS_URL}?action=getStats&_nocache=${Date.now()}_${Math.floor(Math.random() * 1000)}`;
            const response = await fetch(url, { redirect: 'follow' });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const text = await response.text();
            let result;
            try {
                result = JSON.parse(text);
            } catch (jsonErr) {
                if (retryCount < 2) {
                    console.warn("Retrying fetchStats after non-JSON response...");
                    await new Promise(res => setTimeout(res, 1000));
                    return fetchStats(retryCount + 1);
                }
                throw new Error("תגובת השרת אינה בפורמט JSON תקין");
            }

            if (result.success) render(result.data);
            else throw new Error(result.error || "שגיאה לא ידועה בשרת");
        } catch (err) {
            console.error("Dashboard Error:", err);
            alert("שגיאה בטעינת נתונים (" + err.message + "). בצע רענון לדף.");
        }
    }

    function render(data) {
        const s = data.summary;
        const totalLeads = (s.total_leads || 0) + (s.whatsapp_click || 0);
        
        document.getElementById('total-views').innerText = s.page_view || 0;
        document.getElementById('total-downloads').innerText = s.catalog_download || 0;
        document.getElementById('total-leads').innerText = totalLeads;
        document.getElementById('whatsapp-clicks').innerText = s.whatsapp_click || 0;
        
        const rate = (((s.catalog_download || 0) / (s.page_view || 1)) * 100).toFixed(1);
        document.getElementById('conv-rate').innerText = `${rate}%`;

        const ctx = document.getElementById('mainChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();
        
        // Format dates for display (e.g., 20/04)
        const formattedLabels = (data.daily.labels || []).map(label => {
            try {
                const date = new Date(label);
                return date.toLocaleDateString('he-IL', { day: '2-digit', month: '12' === '12' ? '2-digit' : 'short' });
            } catch (e) { return label; }
        });

        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: formattedLabels,
                datasets: [
                    {
                        label: 'מבקרים',
                        data: data.daily.views,
                        backgroundColor: 'rgba(255, 255, 255, 0.1)',
                        borderColor: '#94a3b8',
                        borderWidth: 1
                    },
                    {
                        label: 'הורדות',
                        data: data.daily.downloads,
                        backgroundColor: '#c4d71f',
                        borderRadius: 5
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#f8fafc', font: { family: 'Assistant', size: 14 } } } },
                scales: {
                    y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                }
            }
        });
    }
</script>
</body>
</html>
