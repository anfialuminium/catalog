<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>אנפי יבוא ושיווק בע״מ - מעביר לאתר הרשמי</title>
    <meta http-equiv="refresh" content="0; url=https://www.anfi.co.il/" />
    <link rel="canonical" href="https://www.anfi.co.il/" />
    <script>
      window.location.replace("https://www.anfi.co.il/");
    </script>
    <style>
      :root {
        --primary: #2e5541;
        --accent: #c4d71f;
        --bg: #f8fafc;
        --text: #1e293b;
      }
      body {
        font-family: 'Assistant', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
        padding: 1.5rem;
      }
      .card {
        background: white;
        padding: 2.5rem 2rem;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        max-width: 480px;
        width: 100%;
        border-top: 4px solid var(--primary);
      }
      .logo {
        max-width: 160px;
        height: auto;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
        color: var(--primary);
        margin: 0 0 1rem;
      }
      p {
        color: #64748b;
        font-size: 1.05rem;
        line-height: 1.6;
        margin: 0 0 1.5rem;
      }
      .btn {
        display: inline-block;
        background-color: var(--primary);
        color: white;
        text-decoration: none;
        padding: 0.8rem 1.8rem;
        border-radius: 8px;
        font-weight: 600;
        transition: background-color 0.2s ease, transform 0.1s ease;
      }
      .btn:hover {
        background-color: #234333;
        transform: translateY(-1px);
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(46, 85, 65, 0.2);
        border-radius: 50%;
        border-top-color: var(--primary);
        animation: spin 0.8s linear infinite;
        margin: 1.5rem auto 0;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="https://anfialuminium.github.io/catalog/logo.png" alt="אנפי יבוא ושיווק בע״מ" class="logo" />
      <h1>מעביר אתכם לאתר אנפי...</h1>
      <p>העמוד שחיפשתם עבר לכתובת החדשה שלנו.</p>
      <a href="https://www.anfi.co.il/" class="btn">לחצו כאן אם אינכם מועברים אוטומטית</a>
      <div class="spinner"></div>
    </div>
  </body>
</html>
